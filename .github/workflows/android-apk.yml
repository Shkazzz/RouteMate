name: Build RouteMate Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: flutter create . --project-name routemate --org app.routemate --platforms android
      - name: Enable INTERNET permission in main AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          token="<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">"
          if 'android.permission.INTERNET' not in s:
              s=s.replace(token, token+'\n    <uses-permission android:name="android.permission.INTERNET"/>')
          p.write_text(s)
          assert 'android.permission.INTERNET' in p.read_text()
          PY
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: RouteMate-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
